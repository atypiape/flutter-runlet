name: Slack notifications

on:
  workflow_run:
    workflows: [CI, Branch policy, macOS Prerelease]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_result:
        type: string
        default: ''

permissions: {}

jobs:
  notify:
    name: Send Slack DM
    permissions:
      pull-requests: read
    # Environment credentials are used only by trusted refs; never check out PR code.
    if: >-
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment:
      name: slack-notifications
      deployment: false
    steps:
      - name: Post notification
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD_RESULT: ${{ inputs.build_result }}
        run: |
          set -euo pipefail

          fail() {
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$VERSION" ]]; then
              printf '::error::%s\n' "$1"
              exit 1
            fi
            printf '::warning::%s\n' "$1"
            exit 0
          }

          if [[ -z "$SLACK_BOT_TOKEN" || -z "$SLACK_USER_ID" ]]; then
            fail 'Set SLACK_BOT_TOKEN and SLACK_USER_ID in the slack-notifications environment.'
          fi
          [[ "$SLACK_USER_ID" =~ ^[UW][A-Z0-9]+$ ]] || fail 'SLACK_USER_ID must be a Slack member ID.'

          status() {
            case "$1" in
              success) printf '✅ 成功' ;;
              failure) printf '❌ 失败' ;;
              cancelled) printf '⚪ 已取消' ;;
              timed_out) printf '⏱️ 超时' ;;
              *) printf 'ℹ️ %s' "$1" ;;
            esac
          }

          workflow_reference() {
            local event="$1" branch="$2" sha="$3" title="$4" number='' suffix=''
            local pr_prefix='^\[PR #([1-9][0-9]*)\] '
            if [[ "$event" == pull_request && "$title" =~ $pr_prefix ]]; then
              number="${BASH_REMATCH[1]}"
            elif [[ "$branch" == main && "$sha" =~ ^[0-9a-f]{40}$ &&
                    ( "$event" == push || "$event" == workflow_run ) ]]; then
              # Only report the PR merged at this exact commit. A direct push can have other PR associations.
              number=$(gh api --paginate --slurp \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/commits/$sha/pulls?per_page=100" |
                jq -r --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
                  [.[][] | select(.merged_at and .merge_commit_sha == $sha and
                    .base.ref == "main" and .base.repo.full_name == $repo) | .number] |
                  unique | if length == 1 then .[0] else empty end
                ') || number=''
            fi

            if [[ -n "$number" ]]; then
              printf 'PR #%s' "$number"
            elif [[ -n "$branch" ]]; then
              [[ -z "$sha" ]] || suffix=" · ${sha:0:7}"
              printf '%s%s' "$branch" "$suffix"
            elif [[ -n "$sha" ]]; then
              printf '%s' "${sha:0:7}"
            fi
          }

          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          url="$repo_url/actions/runs/$GITHUB_RUN_ID"
          event_context=''
          event_status=''
          message=''
          pr_title=''
          if [[ -n "$VERSION" ]]; then
            case "$BUILD_RESULT" in
              '') result_text='⏳ 开始打包（可能正在等待 macOS runner）' ;;
              success) result_text='✅ 打包完成，DMG 和校验文件已上传' ;;
              *) result_text="$(status "$BUILD_RESULT")" ;;
            esac
            message="事件：Release $VERSION"$'\n'"运行结果：$result_text"
          else
            case "$GITHUB_EVENT_NAME" in
              workflow_run)
                run=$(jq -ce '.workflow_run' "$GITHUB_EVENT_PATH")
                run_id=$(jq -er '.id' <<< "$run")
                attempt=$(jq -er '.run_attempt' <<< "$run")
                name=$(jq -er 'if .path == ".github/workflows/ci.yml" then "CI"
                  elif .path == ".github/workflows/branch-policy.yml" then "Branch policy"
                  else .name end' <<< "$run")
                result=$(jq -er '.conclusion' <<< "$run")
                reference=$(workflow_reference "$(jq -r '.event // ""' <<< "$run")" \
                  "$(jq -r '.head_branch // ""' <<< "$run")" \
                  "$(jq -r '.head_sha // ""' <<< "$run")" \
                  "$(jq -r '.display_title // ""' <<< "$run")")
                if [[ "$attempt" != 1 ]]; then
                  name="${name}（第 $attempt 次运行）"
                fi
                event_context="${reference:+($reference) }$name"
                event_status=$(status "$result")
                url="$repo_url/actions/runs/$run_id/attempts/$attempt"
                ;;
              pull_request_target)
                number=$(jq -er '.pull_request.number' "$GITHUB_EVENT_PATH")
                pr_title=$(jq -er '.pull_request.title' "$GITHUB_EVENT_PATH")
                event_context="(PR #$number)"
                event_status='✅ 已合入 main'
                url="$repo_url/pull/$number"
                ;;
              workflow_dispatch) message='事件：Slack 通知测试' ;;
              *) fail 'Unsupported Slack notification event.' ;;
            esac
          fi

          payload=$(jq -cn --arg channel "$SLACK_USER_ID" \
            --arg repo "$GITHUB_REPOSITORY" --arg message "$message" --arg url "$url" \
            --arg event_context "$event_context" --arg event_status "$event_status" \
            --arg pr_title "$pr_title" \
            'def section($label; $value):
               {type: "rich_text_section", elements: [
                 {type: "text", text: $label, style: {bold: true}},
                 {type: "text", text: ("：" + $value)}
               ]};
             def lines:
                ([section("仓库"; $repo)] +
                 [$message | split("\n")[] | split("：") |
                   section(.[0]; .[1:] | join("："))] +
                 [{type: "rich_text_section", elements: [
                   {type: "text", text: "链接", style: {bold: true}},
                   {type: "text", text: "："},
                   {type: "link", url: $url}
                 ]}]);
             def event_line:
               [{type: "rich_text_section", elements: ([
                 {type: "text", text: "事件", style: {bold: true}},
                 {type: "text", text: ("：" + ($event_status | split(" ")[0]) + " ")},
                 {type: "link", text: "[详情]", url: $url},
                 {type: "text", text: (" " + $event_context)}
               ] + (if $pr_title == "" then [] else
                 [{type: "text", text: " "},
                  {type: "text", text: $pr_title, style: {bold: true}}]
               end))}];
             {channel: $channel, unfurl_links: false, unfurl_media: false} +
             (if $event_context != "" then
                {text: ("事件：" + $event_status + " " + $event_context +
                        (if $pr_title == "" then "" else " " + $pr_title end) + "\n链接：" + $url),
                 blocks: [{type: "rich_text", elements: event_line}]}
              else
                {text: ("仓库：" + $repo + "\n" + $message + "\n链接：" + $url),
                 blocks: [{type: "rich_text", elements: lines}]}
              end)')
          if ! response=$(curl --silent --fail --max-time 15 \
            --header "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary "$payload" https://slack.com/api/chat.postMessage); then
            fail 'Could not reach Slack or Slack returned an HTTP error.'
          fi
          if ! jq -e '.ok == true' <<< "$response" >/dev/null; then
            error=$(jq -r '.error // empty | select(type == "string" and test("^[a-z0-9_]+$"))' <<< "$response" 2>/dev/null) || error=''
            fail "Slack rejected the notification (${error:-unexpected_response})."
          fi
