name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('[PR #{0}] [{1} {2}] {3}', github.event.number,
  github.event.action == 'edited' && !github.event.changes.base &&
  (github.event.changes.title || github.event.changes.body) && 'metadata' || 'validate',
  github.sha, github.event.pull_request.title) || '' }}

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Metadata edits must not cancel checks already queued for this PR.
  group: >-
    ci-${{ github.event.action == 'edited' && !github.event.changes.base &&
    (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    if: >-
      github.event.action != 'edited' || github.event.pull_request.state != 'closed' ||
      github.event.changes.base || !(github.event.changes.title || github.event.changes.body)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.action == 'edited' && 40 || 5 }}
    permissions:
      actions: read
      contents: read
    outputs:
      scope: ${{ steps.previous.outputs.reused == 'true' && 'reused' || steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse CI for the same PR merge commit
        id: previous
        if: >-
          github.event.action == 'edited' && !github.event.changes.base &&
          (github.event.changes.title || github.event.changes.body)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reuse-pr-check.sh ci.yml 'macOS build and test'
      - name: Check diff and select build scope
        id: scope
        if: steps.previous.outputs.reused != 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Compare the checked-out PR merge commit with its actual base.
            base=$(git rev-parse HEAD^1)
          else
            base="$BEFORE_SHA"
          fi
          git diff --check "$base" HEAD --
          # A rename across scopes must count both its old and new paths.
          files=$(git diff --no-renames --name-only "$base" HEAD --)
          scope=static
          while IFS= read -r path; do
            case "$path" in
              ''|AGENTS.md|CLAUDE.md|README.md|README.zh-CN.md|LICENSE|docs/*.md|docs/screenshots/*|.planning/*.md|.github/pull_request_template.md)
                ;;
              .github/workflows/branch-policy.yml|.github/workflows/slack-notifications.yml|.githooks/pre-push|scripts/plan-prerelease.py|scripts/release-prerelease.sh|scripts/verify-release-authorization.sh|scripts/tests/*)
                ;;
              FlutterRunletTests/*)
                scope='test'
                ;;
              *)
                scope=package
                break
                ;;
            esac
          done <<< "$files"

          # A maintenance push may still carry application changes from earlier merges.
          if [[ "$GITHUB_EVENT_NAME" == push && "$scope" != package ]]; then
            if ! pending=$(python3 -B scripts/plan-prerelease.py --has-unreleased-app-changes) || [[ "$pending" != false ]]; then
              scope=package
              echo 'Full CI required because application changes may be pending release.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'CI scope: %s\n' "$scope" >> "$GITHUB_STEP_SUMMARY"
      - name: Check release scripts
        if: steps.previous.outputs.reused != 'true'
        run: |
          set -euo pipefail
          bash -n scripts/package-release.sh
          bash -n scripts/release-prerelease.sh
          bash -n scripts/verify-release-authorization.sh
          bash -n scripts/verify-release-ci.sh
          bash -n scripts/reuse-pr-check.sh
          sh -n .githooks/pre-push
          python3 -B -m unittest discover -s scripts/tests

  macos:
    name: Xcode tests and packaging
    needs: checks
    if: needs.checks.outputs.scope == 'test' || needs.checks.outputs.scope == 'package'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check project and toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          plutil -lint FlutterRunlet.xcodeproj/project.pbxproj FlutterRunlet/FlutterRunlet.entitlements
      - name: Build and run XCTest
        run: |
          xcodebuild -quiet -project FlutterRunlet.xcodeproj -scheme FlutterRunlet \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/ci/debug -parallel-testing-enabled NO test
      - name: Build and verify Universal DMG
        id: dmg
        if: needs.checks.outputs.scope == 'package'
        uses: ./.github/actions/package-dmg
      - name: Upload candidate
        if: needs.checks.outputs.scope == 'package'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: FlutterRunlet-CI-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.dmg.outputs.directory }}/FlutterRunlet-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  required:
    name: >-
      ${{ github.event.action == 'edited' && github.event.pull_request.state == 'closed' &&
      !github.event.changes.base && (github.event.changes.title || github.event.changes.body) &&
      'CI skipped for closed PR' || 'macOS build and test' }}
    needs: [checks, macos]
    if: >-
      always() && (github.event.action != 'edited' || github.event.pull_request.state != 'closed' ||
      github.event.changes.base || !(github.event.changes.title || github.event.changes.body))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify CI results
        env:
          CHECKS: ${{ needs.checks.result }}
          SCOPE: ${{ needs.checks.outputs.scope }}
          MACOS: ${{ needs.macos.result }}
        run: |
          case "$CHECKS:$SCOPE:$MACOS" in
            success:static:skipped|success:reused:skipped|success:test:success|success:package:success) ;;
            *)
              printf '::error::CI did not complete successfully (checks=%s, scope=%s, macOS=%s).\n' "$CHECKS" "$SCOPE" "$MACOS"
              exit 1
              ;;
          esac
