name: Branch policy
run-name: '[PR #${{ github.event.number }}] ${{ github.event.pull_request.title }}'

# Git 规则见 docs/GIT-WORKFLOW.md，规则变更时同步核对 .githooks/pre-push。
on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: >-
    branch-policy-${{ github.event.action == 'edited' && !github.event.changes.base &&
    (github.event.changes.title || github.event.changes.body) && 'metadata-' || '' }}${{
    github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    # Keep skipped metadata edits separate from the required branch-policy check.
    name: >-
      ${{ github.event.action == 'edited' && !github.event.changes.base &&
      (github.event.changes.title || github.event.changes.body) &&
      'Branch policy skipped for PR metadata edit' || format('branch-policy ({0})', github.base_ref) }}
    if: >-
      github.event.action != 'edited' || github.event.changes.base ||
      !(github.event.changes.title || github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR source and hotfix history
        shell: bash
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          case "$PR_HEAD" in
            codex/*) fail "codex/ branches are local-only and cannot open pull requests." ;;
          esac

          case "$PR_BASE" in
            dev)
              case "$PR_HEAD" in
                feat/?*|fix/?*|docs/?*|refactor/?*|perf/?*|test/?*|chore/?*|hotfix/?*) exit 0 ;;
                *) fail "PRs into dev must come from a feat/, fix/, docs/, refactor/, perf/, test/, chore/, or hotfix/ branch." ;;
              esac
              ;;
            main)
              [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] ||
                fail "PRs into main must come from this repository."
              case "$PR_HEAD" in
                dev) exit 0 ;;
                hotfix/?*) ;;
                *) fail "PRs into main must come from dev or from a hotfix/ branch based on main." ;;
              esac
              ;;
            *) fail "Unexpected PR target." ;;
          esac

          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid PR head commit."

          # Fetch history into a bare repository so the check never needs a checkout.
          graph=$(mktemp -d "$RUNNER_TEMP/branch-policy.XXXXXXXX")
          git -C "$graph" init --bare --quiet
          git -C "$graph" fetch --quiet --no-tags --filter=tree:0 \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            'refs/heads/main:refs/policy/main' \
            'refs/heads/dev:refs/policy/dev' \
            "$PR_HEAD_SHA:refs/policy/head"

          git -C "$graph" merge-base --is-ancestor refs/policy/main refs/policy/head ||
            fail "A hotfix/ PR into main must include the current main tip."

          # Excluding dev must not remove any commits beyond those already in main.
          hotfix_commits=$(git -C "$graph" rev-list --count refs/policy/main..refs/policy/head)
          hotfix_without_dev=$(git -C "$graph" rev-list --count refs/policy/head --not refs/policy/main refs/policy/dev)
          [[ "$hotfix_commits" == "$hotfix_without_dev" ]] ||
            fail "A hotfix/ PR into main cannot include commits unique to dev."
