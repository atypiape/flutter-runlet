name: macOS Prerelease
run-name: "${{ inputs.publish && 'Request prerelease' || 'Build candidate' }} ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (vX.Y.Z)"
        type: string
        required: true
      publish:
        description: "Request publication after reviewing this run's DMG and SHA-256"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: macos-prerelease
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - name: Validate release input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Select the main branch."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a vX.Y.Z tag without leading zeroes."
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify Universal DMG
        id: dmg
        uses: ./.github/actions/package-dmg
        with:
          version: ${{ inputs.version }}
      - name: Upload candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: FlutterRunlet-${{ inputs.version }}-candidate-${{ github.run_attempt }}
          path: ${{ steps.dmg.outputs.directory }}/FlutterRunlet-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish approved prerelease
    if: inputs.publish && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: FlutterRunlet-${{ inputs.version }}-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Verify approval and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DMG_SHA256: ${{ needs.build.outputs.sha256 }}
        run: bash scripts/release-prerelease.sh "$RUNNER_TEMP/release-candidate"
