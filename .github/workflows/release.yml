name: macOS Prerelease
run-name: "${{ github.event_name == 'workflow_run' && 'Prepare prerelease from main CI' || format('Build {0}', inputs.version) }}"

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (vX.Y.Z)"
        type: string
        required: true
      publish:
        description: "Publish the named prerelease approved by the repository owner merge"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: macos-prerelease-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan prerelease
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose version and collect notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$tip" != "$GITHUB_SHA" ]]; then
              echo 'main has advanced. Skip this candidate.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            python3 scripts/plan-prerelease.py "$RUNNER_TEMP/release-notes.md"
          else
            if ! [[ "$REQUESTED_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo '::error::Use a vX.Y.Z tag without leading zeroes.'
              exit 1
            fi
            if [[ "$PUBLISH_REQUESTED" == true ]]; then
              bash scripts/verify-release-authorization.sh "$REQUESTED_VERSION"
              cp "docs/releases/$REQUESTED_VERSION.md" "$RUNNER_TEMP/release-notes.md"
            fi
            printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify full CI for the release commit
        if: steps.plan.outputs.version != '' && (github.event_name == 'workflow_run' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-ci.sh
      - name: Upload bilingual notes
        if: steps.plan.outputs.version != '' && (github.event_name == 'workflow_run' || inputs.publish)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: FlutterRunlet-${{ steps.plan.outputs.version }}-notes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 30

  notify-build-start:
    name: Notify Slack that packaging started
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      pull-requests: read
    uses: ./.github/workflows/slack-notifications.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}

  build:
    name: Build release candidate
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - name: Check toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify Universal DMG
        id: dmg
        uses: ./.github/actions/package-dmg
        with:
          version: ${{ needs.plan.outputs.version }}
      - name: Upload candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: FlutterRunlet-${{ needs.plan.outputs.version }}-candidate-${{ github.run_attempt }}
          path: ${{ steps.dmg.outputs.directory }}/FlutterRunlet-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  notify-build-result:
    name: Notify Slack of packaging result
    needs: [plan, build, notify-build-start]
    if: always() && needs.plan.outputs.version != '' && needs.build.result != 'skipped'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/slack-notifications.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      build_result: ${{ needs.build.result }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}

  publish:
    name: Publish approved prerelease
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      (github.event_name == 'workflow_run' || inputs.publish)
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: FlutterRunlet-${{ needs.plan.outputs.version }}-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: FlutterRunlet-${{ needs.plan.outputs.version }}-notes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes
      - name: Verify pre-merge authorization and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          DMG_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          bash scripts/release-prerelease.sh "$RUNNER_TEMP/release-candidate" \
            "$RUNNER_TEMP/release-notes/release-notes.md"
