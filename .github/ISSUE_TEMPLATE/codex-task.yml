name: Task or Issue
description: Report a problem, suggest an improvement, or propose a development task.
body:
  - type: textarea
    id: goal
    attributes:
      label: Problem and expected outcome
      placeholder: What is happening now? What should happen instead?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Include steps to reproduce, screenshots, how to verify the change, or scope limits as applicable.
    validations:
      required: false
