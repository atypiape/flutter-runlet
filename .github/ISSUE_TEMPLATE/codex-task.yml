name: 任务或问题
description: 记录一个问题、改进想法或开发任务。
body:
  - type: markdown
    attributes:
      value: |
        准备好交给 Codex 时，由维护者添加 `task:ready`。贴标后若修改标题或正文，请移除后重新添加该标签。
  - type: textarea
    id: goal
    attributes:
      label: 问题与预期
      placeholder: 现在发生了什么？希望改成什么样？
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息
      description: 按需补充复现步骤、截图、验证方法或改动边界。
    validations:
      required: false
